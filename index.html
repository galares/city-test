<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测测你适合在哪座城市生活</title>
<style>
  :root{
    --bg:#eef4f1; --card:#fbfefd; --ink:#22302c; --sub:#657670; --line:#d8e5df;
    --accent:#2a9d8f; --accent-soft:#d9f0ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    -webkit-tap-highlight-color:transparent}
  .wrap{max-width:440px;margin:0 auto;padding:20px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;
    box-shadow:0 6px 24px rgba(20,60,50,.07)}
  .hide{display:none!important}
  /* 首页 */
  .cover{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center}
  .badge{display:inline-block;align-self:center;background:var(--accent-soft);color:var(--accent);
    font-size:13px;padding:4px 12px;border-radius:99px;font-weight:600}
  .cover h1{font-size:32px;line-height:1.3;letter-spacing:1px}
  .cover h1 em{font-style:normal;color:var(--accent)}
  .cover p{color:var(--sub);font-size:15px;line-height:1.7}
  .types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
  .types span{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 0;font-size:14px;color:var(--sub)}
  .btn{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;
    font-size:17px;font-weight:700;padding:15px;cursor:pointer;transition:transform .1s;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  /* 答题 */
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .qmeta{display:flex;justify-content:space-between;color:var(--sub);font-size:13px}
  .qtext{font-size:21px;line-height:1.5;font-weight:700;margin-bottom:18px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:14px 14px;font-size:15.5px;line-height:1.5;color:var(--ink);cursor:pointer;font-family:inherit}
  .opt:hover{border-color:var(--accent)}
  .opt.on{border-color:var(--accent);background:var(--accent-soft)}
  .back{margin-top:16px;background:none;border:0;color:var(--sub);font-size:14px;cursor:pointer;align-self:flex-start;font-family:inherit}
  /* 结果 */
  .res-top{text-align:center;padding-top:0}
  .res-top small{color:var(--sub);font-size:13px}
  .res-icon{width:84px;height:84px;margin:12px auto 8px;border-radius:24px;display:grid;place-items:center;
    font-size:40px;font-weight:800;color:#fff}
  .res-name{font-size:32px;font-weight:800;letter-spacing:3px}
  .res-tag{font-weight:600;margin-top:6px}
  .res-desc{font-size:15px;line-height:1.8;margin:16px 0 4px;color:#33423d}
  .sec{margin-top:16px}
  .sec h3{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:6px}
  .sec p{font-size:15px;line-height:1.7}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mini div{background:var(--bg);border-radius:12px;padding:10px 9px}
  .mini b{display:block;font-size:12.5px;margin-bottom:4px}
  .mini span{display:block;font-size:12.5px;line-height:1.55;color:#44534e}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{font-size:13px;padding:4px 12px;border-radius:99px}
  .dist{display:flex;flex-direction:column;gap:7px}
  .row{display:grid;grid-template-columns:48px 1fr 38px;align-items:center;gap:8px;font-size:13px}
  .row .t{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .row .t i{display:block;height:100%;border-radius:99px}
  .row b{text-align:right;font-weight:600;color:var(--sub)}
  .tip{margin-top:16px;text-align:center;color:var(--sub);font-size:13px}
  .actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .rcard{border-radius:22px;padding:20px 18px 12px;color:#fff;text-align:center;background-image:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.3));box-shadow:0 8px 26px rgba(20,60,50,.18)}
  .rc-top{font-size:13px;opacity:.9;letter-spacing:1px}
  .rc-name{font-size:60px;font-weight:800;letter-spacing:6px;line-height:1.15;margin-top:6px}
  .rc-tag{font-size:16px;font-weight:600;margin-top:4px}
  .rc-kw{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
  .rc-kw span{background:rgba(255,255,255,.22);font-size:13px;padding:4px 12px;border-radius:99px}
  .rc-radar{margin-top:6px}
  .rc-foot{font-size:12px;opacity:.85;padding-top:4px;letter-spacing:1px}
  .legend{font-size:12px;color:var(--sub);text-align:center;margin-top:4px}
  .legend i{display:inline-block;width:16px;height:0;border-top:3px solid #888;vertical-align:middle;margin-right:4px}
  .legend i.l2{border-top:2px dashed #8a9a94;margin-left:4px}
  footer{margin-top:22px;text-align:center;color:#8da09a;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <!-- 首页 -->
  <section id="cover" class="cover">
    <span class="badge">24 道题 · 约 4 分钟</span>
    <h1>测测你适合<br>在哪座<em>城市</em>生活</h1>
    <p>12 座城市、6 个维度，出结果卡和雷达图。<br>凭第一反应选，别想太久。</p>
    <div class="types" id="coverChips"></div>
    <button class="btn" id="startBtn">开始测试</button>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="hide" style="display:flex;flex-direction:column">
    <div class="qmeta"><span id="qnum"></span><span>凭直觉选</span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div class="qtext" id="qtext"></div>
      <div class="opts" id="opts"></div>
    </div>
    <button class="back" id="backBtn">‹ 上一题</button>
  </section>

  <!-- 结果 -->
  <section id="result" class="hide">
    <div class="rcard" id="rCard">
      <div class="rc-top">我最适合生活的城市是</div>
      <div class="rc-name" id="rcName"></div>
      <div class="rc-tag" id="rcTag"></div>
      <div class="rc-kw" id="rcKw"></div>
      <div class="rc-radar" id="rcRadar"></div>
      <div class="rc-foot">测测你适合在哪座城市生活</div>
    </div>
    <p class="tip">截图上面这张卡，发给朋友看看</p>
    <div class="card" style="margin-top:14px">
      <div class="res-top">
        <div class="res-icon" id="rIcon"></div>
        <div class="res-name" id="rName"></div>
        <div class="res-tag" id="rTag"></div>
      </div>
      <p class="res-desc" id="rDesc"></p>
      <div class="sec"><div class="mini" id="rMini"></div></div>
      <div class="sec"><h3>你的六维生活画像</h3><div id="rBigRadar"></div>
        <p class="legend"><i class="l1"></i>你的画像　<i class="l2"></i>该城市的大致画像</p></div>
      <div class="sec"><h3>可能要适应的地方</h3><p id="rCare"></p></div>
      <div class="sec"><h3>同类型的备选城市</h3><div class="chips" id="rAlt"></div></div>
      <div class="sec"><h3>给你的一句话</h3><p id="rTip"></p></div>
      <div class="sec"><h3>你和各城市的契合度（前 6）</h3><div class="dist" id="rDist"></div></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="againBtn">再测一次</button>
    </div>
  </section>

  <footer>本测试仅供娱乐，城市介绍为大致印象，不构成任何定居或搬迁建议</footer>
</div>

/*SCORE-START*/
function scoreAnswers(ans){
  const score = Object.fromEntries(ORDER.map(k=>[k,0]));
  ans.forEach((oi,qi)=>{
    const w = QS[qi][1][oi][1];
    for (const k in w) score[k] += w[k];
  });
  return score;
}
function pickTop(score){
  return ORDER.reduce((a,b)=> score[b]>score[a] ? b : a);
}
// 用户维度：把作答累计的维度分，除以“随机作答的期望值”后折算到 0~1（随机作答约 0.5，偏向该维度越接近 1）
const DIM_MEAN = Object.fromEntries(DIMS.map(([d])=>[d, QS.reduce((s,q)=>s+q[1].reduce((t,o)=>t+(o[2][d]||0),0)/q[1].length,0)]));
function userDims(ans){
  const sum = Object.fromEntries(DIMS.map(([d])=>[d,0]));
  ans.forEach((oi,qi)=>{
    const dm = QS[qi][1][oi][2];
    for (const d in dm) sum[d] += dm[d];
  });
  return Object.fromEntries(DIMS.map(([d])=>[d, Math.max(0.08, Math.min(1, 0.5*sum[d]/DIM_MEAN[d]))]));
}

/*UI-START*/
const $ = id => document.getElementById(id);
let cur = 0, ans = [];

function show(id){ ["cover","quiz","result"].forEach(s=>$(s).classList.toggle("hide", s!==id)); window.scrollTo(0,0); }

$("coverChips").innerHTML = ORDER.map(k=>`<span>${TYPES[k].name}</span>`).join("");

function renderQ(){
  const [q, opts] = QS[cur];
  $("qnum").textContent = `第 ${cur+1} / ${QS.length} 题`;
  $("prog").style.width = (cur/QS.length*100)+"%";
  $("qtext").textContent = q;
  $("opts").innerHTML = "";
  opts.forEach(([t],i)=>{
    const b = document.createElement("button");
    b.className = "opt" + (ans[cur]===i ? " on" : "");
    b.textContent = "ABCD"[i] + ". " + t;
    b.onclick = () => { ans[cur]=i; b.classList.add("on"); setTimeout(next, 180); };
    $("opts").appendChild(b);
  });
  $("backBtn").style.visibility = cur ? "visible" : "hidden";
}

function next(){
  if (cur < QS.length-1){ cur++; renderQ(); } else { renderResult(scoreAnswers(ans), userDims(ans)); }
}

// 六维雷达图（纯 SVG）。vals/prof 为 {p,y,n,o,w,c}，vals 范围 0~1，prof 范围 0~10
function radar(vals, prof, o){
  const S=o.size, cx=S/2, cy=S/2, R=S/2-o.pad, n=DIMS.length;
  const pt=(i,r)=>{const a=(-90+i*360/n)*Math.PI/180;return [cx+r*Math.cos(a), cy+r*Math.sin(a)];};
  const poly=(f)=>DIMS.map(([d],i)=>pt(i,R*f(d)).map(v=>v.toFixed(1)).join(",")).join(" ");
  let s=`<svg viewBox="0 0 ${S} ${S}" width="100%" style="max-width:${S}px;display:block;margin:0 auto" role="img" aria-label="六维雷达图">`;
  [1/3,2/3,1].forEach(f=>{ s+=`<polygon points="${poly(()=>f)}" fill="none" stroke="${o.grid}" stroke-width="1"/>`; });
  DIMS.forEach((_,i)=>{ const [x,y]=pt(i,R); s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${o.grid}" stroke-width="1"/>`; });
  if (prof) s+=`<polygon points="${poly(d=>prof[d]/10)}" fill="none" stroke="${o.profColor}" stroke-width="2" stroke-dasharray="5 4"/>`;
  s+=`<polygon points="${poly(d=>vals[d])}" fill="${o.fill}" stroke="${o.stroke}" stroke-width="2.5" stroke-linejoin="round"/>`;
  DIMS.forEach(([d],i)=>{ const [x,y]=pt(i,vals[d]*R); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${o.stroke}"/>`; });
  DIMS.forEach(([,name],i)=>{
    const [x,y]=pt(i,R+o.lab); const anc = Math.abs(x-cx)<4 ? "middle" : (x>cx ? "start" : "end");
    s+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anc}" font-size="${o.fs}" fill="${o.text}" font-weight="600">${name}</text>`;
  });
  return s+"</svg>";
}

function renderResult(score, dims){
  const top = pickTop(score);
  const T = TYPES[top];
  // 结果卡（适合截图发朋友圈）
  const rc = $("rCard");
  rc.style.backgroundColor = T.color;
  $("rcName").textContent = T.name;
  $("rcTag").textContent = T.tag;
  $("rcKw").innerHTML = T.kw.map(k=>`<span>${k}</span>`).join("");
  $("rcRadar").innerHTML = radar(dims, null, {size:290,pad:66,lab:14,fs:13,grid:"rgba(255,255,255,.35)",fill:"rgba(255,255,255,.38)",stroke:"#fff",text:"#fff"});
  // 详情
  $("rIcon").textContent = T.icon; $("rIcon").style.background = T.color;
  $("rName").textContent = T.name; $("rName").style.color = T.color;
  $("rTag").textContent = T.tag;  $("rTag").style.color = T.color;
  $("rDesc").textContent = T.desc;
  $("rMini").innerHTML =
    `<div><b>生活成本</b><span>${T.cost}</span></div>`+
    `<div><b>生活节奏</b><span>${T.pace}</span></div>`+
    `<div><b>气候</b><span>${T.climate}</span></div>`;
  $("rBigRadar").innerHTML = radar(dims, T.prof, {size:320,pad:62,lab:16,fs:13,grid:"#d8e5df",fill:T.color+"40",stroke:T.color,profColor:"#8a9a94",text:"#33423d"});
  $("rCare").textContent = T.care;
  $("rAlt").innerHTML = T.alt.map(n=>{
    const c = TYPES[NAME2KEY[n]].color;
    return `<span style="color:${c};background:${c}1a">${n}</span>`;
  }).join("");
  $("rTip").textContent = T.tip;
  const total = ORDER.reduce((s,k)=>s+score[k],0) || 1;
  const sorted = [...ORDER].sort((a,b)=>score[b]-score[a]).slice(0,6);
  $("rDist").innerHTML = sorted.map(k=>{
    const p = Math.round(score[k]/total*100);
    return `<div class="row"><span>${TYPES[k].name}</span><div class="t"><i style="width:${Math.min(100,p*3)}%;background:${TYPES[k].color}"></i></div><b>${p}%</b></div>`;
  }).join("");
  show("result");
}

// 仅用于截图的预览参数：?demo=成都 直接显示该城市结果；?demo=quiz 显示答题页。不带参数时完全不生效。
